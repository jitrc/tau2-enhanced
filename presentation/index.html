<p><strong>Purpose:</strong> Evaluate conversational AI agents in customer service scenarios</p>
<p><strong>Key Features:</strong></p>
<ul>
<li>Multi-turn conversations with state management</li>
<li>Tool calling: Complex tools need to be called in correct sequence</li>
<li>Real-world complexity: Database operations, constraints, error handling</li>
</ul>

<h1 id="impact-score-prioritizing-failures">Impact Score: Prioritizing Failures</h1>
<p><strong>Formula:</strong> <code>failure_rate × simulations_affected / total_simulations × 100</code></p>
<p><strong>Why Impact Score?</strong></p>
<ul>
<li>Combines <strong>frequency</strong> (how often it fails) with <strong>reach</strong> (how many simulations affected)</li>
<li>Prioritizes failures that block the most user tasks</li>
<li>Better than raw failure count alone</li>
</ul>
<p><strong>Example:</strong></p>
<ul>
<li>Tool A: 100% failure, 2/100 sims → Impact <strong>2.0</strong></li>
<li>Tool B: 50% failure, 30/100 sims → Impact <strong>15.0</strong><br />
→ <strong>Tool B is higher priority</strong> despite lower failure rate</li>
</ul>
</section>

<p><strong>Scale of Analysis:</strong></p>
<ul>
<li><strong>13 tools</strong> analyzed across <strong>1,162 calls</strong> in 200 simulations</li>
<li><strong>4 tools</strong> excellent (≥95% success), <strong>9 tools</strong> poor (&lt;75%)</li>

</ul>
<p><strong>High-Impact vs High-Volume:</strong></p>

<li><code>get_reservation_details</code>: 488 calls, 44.5% success, <strong>0.1 impact</strong> (recoverable)</li>

</ul>

<h1 id="the-efficiency-crisis">The Efficiency Crisis</h1>
<p><strong>Sequence Comparison: Expected vs Actual (172 tasks, 592 ground truth actions)</strong></p>
<table>
<thead>
<tr>
<th>Metric</th>
<th>Value</th>
<th>Problem</th>
</tr>

<tr>

<td>33.4%</td>
<td>67% of executed actions are wrong</td>
</tr>
<tr>
<td><strong>Recall</strong></td>
<td>61.2%</td>
<td>Missing 39% of required actions</td>
</tr>
<tr>
<td><strong>Waste</strong></td>
<td>676 extra</td>
<td>1,084 actual vs 592 expected (62% overhead)</td>
</tr>
<tr>
<td><strong>Arg Errors</strong></td>
<td>46</td>
<td>Even &quot;correct&quot; tools have wrong params</td>
</tr>
</tbody>
</table>
<p><strong>Does sequence order matter?</strong> Not as much as you'd think:</p>
<ul>
<li>75 tasks: Correct order → Success ✓</li>
<li><strong>78 tasks: Correct order → Still Failed</strong> <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/></li>
</ul>
<p><strong>Key Insight:</strong> Argument accuracy matters more than sequence order</p>
<p><strong>Extreme waste:</strong> Task 23 executed <strong>86 extra actions</strong> (search loops spiraled out of control)</p>
</section>

<h1 id="the-vicious-cycle-problem">The Vicious Cycle Problem</h1>
<p>Impact-driven analysis reveals how failures compound:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>1. Complex tasks require multiple actions
              ↓
2. High-impact tool failures (84.8% failure rate, book_reservation)
              ↓
3. Task failure → Agent confusion → Self-loops (get_reservation: 287x)
              ↓
4. Context accumulation (37.3% self-loop rate)
              ↓
5. Performance degradation → More action failures
              ↓
         [Back to step 2]
</code></pre>
<p><strong>Breaking the Cycle:</strong></p>
<ul>
<li><strong><code>RetryManagedAgent</code>:</strong> Reduce step 2 failures</li>
<li><strong><code>ContextManagedAgent</code>:</strong> Prevent step 4 accumulation</li>
<li><strong><code>EnhancedLLMAgent</code></strong> breaks the cycle at both points</li>
</ul>
</section>

<h1 id="retrymanagedagent-architecture">RetryManagedAgent Architecture</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>┌──────────────────────────────────────────────────┐
│           LLM generates tool call                │
└─────────────────┬────────────────────────────────┘
                  │
                  ▼
         ┌────────────────┐
         │ Execute Tool   │
         └────────┬───────┘
                  │
           ┌──────┴──────┐
           │ Success?    │
           └──────┬──────┘
                  │
        ┌─────────┴─────────┐
        │                   │
       YES                 NO
        │                   │
        ▼                   ▼
    [Return]     ┌──────────────────┐
                 │ Classify Error   │
                 │ - Validation?    │
                 │ - Missing field? │
                 │ - Type error?    │
                 └────────┬─────────┘
                          │
                          ▼
                 ┌──────────────────┐
                 │ Retry (max 3)    │
                 │ with hints       │
                 └────────┬─────────┘
                          │
                    [Back to LLM]
</code></pre>
</section>

<h1 id="contextmanagedagent--enhancedllmagent">ContextManagedAgent &amp; EnhancedLLMAgent</h1>
<p><strong>Context Management Strategies:</strong></p>
<ol>
<li><strong>Sliding Window:</strong> Keep system message, task description, last N messages; drop middle history</li>
<li><strong>Compression:</strong> Summarize old messages to maintain state consistency</li>
</ol>
<p><strong>EnhancedLLMAgent = RetryManagedAgent + ContextManagedAgent</strong></p>
<p><strong>How They Work Together:</strong></p>
<ul>
<li>Context management: Proactive (before generation)</li>
<li>Retry logic: Reactive (after failure)</li>
<li>No interference: Clean separation of concerns</li>
</ul>
</section>

<h1 id="proof-of-concept-insights-and-learnings">Proof-of-Concept: Insights and Learnings</h1>
<p><strong>Sequence Comparison Insights:</strong></p>
<ul>
<li><strong>RetryAgent:</strong> +11pp tool success, +1 matched action, but +107 extra actions (466 vs 359)</li>
<li><strong>ContextAgent:</strong> Minimal improvement (+2pp tool), actually worse precision/recall</li>
<li><strong>EnhancedAgent:</strong> Best precision (3.78%) and recall (37.04%), but generates most extra actions (482)</li>
<li><strong>Critical Finding:</strong> +13pp tool success doesn't translate to task success (55% vs 60% baseline)</li>
<li><strong>Root Cause:</strong> All agents have ~3% precision and 26-37% recall — sequence planning fundamentally broken</li>
</ul>
<p><strong>Key Learning:</strong> Tool-level improvements ≠ Task-level success without addressing:</p>
<ol>
<li><strong>Precision Crisis:</strong> 96-97% of executed actions are unnecessary (extra actions)</li>
<li><strong>Recall Gap:</strong> Missing 63-74% of required actions</li>
<li><strong>Exploration Waste:</strong> 359-482 extra actions per 54 expected actions (6.6-8.9× overhead)</li>
</ol>
</section>

<p><strong>1. Non-invasive Monkey Patching</strong></p>
<ul>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> Backward compatible, no fork needed</li>

<p><strong>2. Structured Logging vs Simple Metrics</strong></p>
<ul>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> Capture everything: tool execution, state changes, timing</li>

<p><strong>3. Three Agent Variants (A/B Testing)</strong></p>

<h1 id="next-steps-validation--optimization">Next Steps: Validation &amp; Optimization</h1>
<p><strong>1. Proof-of-Concept Completed (Gemini)</strong></p>
<ul>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> <code>retry_agent</code>: <strong>+11.1pp</strong> tool success (57.4% → 68.5%), maintained task success at 60%</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/26a0.svg" data-marp-twemoji=""/> <code>enhanced_agent</code>: <strong>+13.0pp</strong> tool success (57.4% → 70.4%), but -5pp task success (60% → 55%)</li>
<li><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f50d.svg" data-marp-twemoji=""/> <strong>Key Finding:</strong> Tool-level improvements don't translate to task-level success<br />
<strong>2. Impact-Driven Optimization Priorities</strong></li>
</ul>
<p><strong>Priority 1: High-Impact Tool Failures (Impact &gt;5.0)</strong></p>
<ul>
<li>Target: <code>book_reservation</code> (9.3), <code>update_reservation_flights</code> (7.9), <code>search_direct_flight</code> (7.5)</li>
<li><strong>Action:</strong> Targeted retry logic + validation hints</li>
</ul>
<p><strong>Priority 2: &quot;Never Called&quot; Failures (80%)</strong></p>
<ul>
<li><strong>Action:</strong> Few-shot examples for tool selection</li>
</ul>
<p><strong>Priority 3: Efficiency Crisis (91% wasted actions)</strong></p>
<ul>
<li><strong>Problem:</strong> 529 actual vs 54 expected actions (3.78% precision, 91% waste)</li>
<li><strong>Action:</strong> Early stopping criteria, exploration limits, better planning, state management</li>
</ul>
</section>

<h1 id="backup-why-not-terminal-bench">Backup: Why Not terminal-bench?</h1>
<p>While <code>terminal-bench</code> was considered, <code>tau2-bench</code> was chosen for its deeper analytical capabilities.</p>
<h3 id="terminal-bench-pros"><code>terminal-bench</code>: Pros</h3>
<ul>
<li><strong>Practical &amp; Broad Coverage:</strong> Evaluates agents on real-world command-line tasks across several categories (e.g., coding, networking).</li>
<li><strong>Reproducible:</strong> No LLM-based user simulator means fully deterministic results.</li>
<li><strong>Extensible:</strong> Easy to add new tasks, including multi-modal ones.</li>
</ul>
<h3 id="rationale-for-not-selecting">Rationale for Not Selecting</h3>
<ul>
<li><strong>Tests Memorization over Agency:</strong> The benchmark's structure can reward &quot;memorized&quot; solutions for specific problems rather than testing true agentic reasoning and problem-solving.</li>
<li><strong>Lacks Analytical Depth:</strong> The clean, non-messy environments and lack of diversity within similar tasks make it difficult to perform the deep, systematic failure analysis needed for root cause identification.</li>
</ul>
</section>

<h1 id="backup-tau2-bench-sophistication">Backup: tau2-bench Sophistication</h1>

<p>The benchmark tests for four distinct and sophisticated categories of failure.</p>
<p><strong>1. Policy Violations</strong> (14% of failures)</p>
<ul>
<li><strong>Tests:</strong> Will the agent break established rules to please a user?</li>
<li><strong>Example:</strong> Agent agrees to cancel a non-refundable ticket after the user insists.</li>
</ul>
<p><strong>2. User Claim Verification</strong> (12% of failures)</p>
<ul>
<li><strong>Tests:</strong> Does the agent validate user claims against the database, or does it trust blindly?</li>
<li><strong>Example:</strong> Agent offers a &quot;Gold member&quot; discount without checking the user's actual &quot;Regular member&quot; status.</li>
</ul>
<p><strong>3. Reasoning &amp; Calculation</strong> (87% of failures) ← <strong>Our Focus</strong></p>
<ul>
<li><strong>Tests:</strong> Can the agent execute complex, multi-step operations and calculations correctly?</li>
<li><strong>Example:</strong> Agent fails to calculate the optimal payment split using gift cards and a certificate.</li>
</ul>
<p><strong>4. Complex Intent Handling</strong> (7% of failures)</p>
<ul>
<li><strong>Tests:</strong> Can the agent handle multi-part requests, context switching, and evolving user goals?</li>
<li><strong>Example:</strong> User asks to cancel two bookings and modify a third, then adds a new request mid-conversation.</li>
</ul>
</section>

<h1 id="backup-proposed-training-strategy">Backup: Proposed Training Strategy</h1>
<h2 id="1-structured-output-training-50k-examples">1. Structured Output Training (~50k examples)</h2>
<p><strong>Goal:</strong> Reduce validation errors from root cause</p>
<p><strong>Focus Areas (from actual failure analysis):</strong></p>
<ul>
<li><code>book_reservation</code>: 88.9% failure → Payment parameter structure</li>
<li><code>search_direct_flight</code>: 78.8% failure → Search parameter validation</li>
<li><code>update_reservation_flights</code>: 100% failure → Nested object handling</li>
</ul>
<p><strong>Data Generation:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">{
  <span class="hljs-string">&quot;correct&quot;</span>: {<span class="hljs-string">&quot;payment&quot;</span>: {<span class="hljs-string">&quot;gift_card_ids&quot;</span>: [...], <span class="hljs-string">&quot;certificate_id&quot;</span>: <span class="hljs-string">&quot;...&quot;</span>}},
  <span class="hljs-string">&quot;error&quot;</span>: {<span class="hljs-string">&quot;payment&quot;</span>: {<span class="hljs-string">&quot;method&quot;</span>: <span class="hljs-string">&quot;split&quot;</span>, <span class="hljs-string">&quot;cards&quot;</span>: [...], <span class="hljs-string">&quot;cert&quot;</span>: <span class="hljs-string">&quot;...&quot;</span>}}
}

<h2 id="2-model-specific-error-recovery-training">2. Model-Specific Error Recovery Training</h2>
<p><strong>Approach:</strong></p>
<ul>
<li>Train on retry patterns that succeeded for each model</li>
<li>Build error signature → recovery strategy mappings</li>
<li>Adaptive strategies that switch based on error type</li>
</ul>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">{

}
</code></pre>
<h2 id="3-context-management-dataset-25k-examples">3. Context Management Dataset (~25k examples)</h2>
<p><strong>Goal:</strong> Prevent performance cliffs and confusion<br />
<strong>Focus:</strong> Long conversations with state consistency<br />
<strong>Validation:</strong> Monitor self-loop rate (&lt;35%) and efficiency metrics</p>
<p><strong>Expected Outcomes:</strong></p>
<ul>
<li>Structural: +5-10pp from better parameter formatting</li>
<li>Recovery: +3-5pp from intelligent retry strategies</li>
<li>Efficiency: -15% tool calls through better planning</li>
</ul>
</section>
